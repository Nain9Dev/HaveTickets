name: CI

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  test-dotnet:
    name: Build & Test .NET Solution
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore Dependencies
        run: dotnet restore HaveTickets.slnx

      - name: Build Solution (-warnaserror)
        run: dotnet build HaveTickets.slnx -c Release --no-restore -warnaserror

      - name: Run Domain Unit Tests
        run: dotnet test HaveTickets.Domain.Tests/HaveTickets.Domain.Tests.csproj -c Release --no-build

      - name: Run API Integration Tests
        run: dotnet test HaveTickets.Api.Tests/HaveTickets.Api.Tests.csproj -c Release --no-build

  test-frontend:
    name: Build & Typecheck Vue 3 Client
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: HaveTickets.Client/package-lock.json

      - name: Install Frontend Dependencies
        working-directory: HaveTickets.Client
        run: npm ci

      - name: Typecheck & Build Client Bundle
        working-directory: HaveTickets.Client
        run: npm run build
