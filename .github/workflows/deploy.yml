name: Deploy Blazor to GitHub Pages

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Publish Blazor WebAssembly
        run: dotnet publish HaveTickets.WebUI/HaveTickets.WebUI.csproj -c Release -o release --nologo

      - name: Add CNAME and .nojekyll files
        run: |
          echo "tickets.naindev.com" > release/wwwroot/CNAME
          touch release/wwwroot/.nojekyll

      - name: Add 404.html fallback for Blazor routing
        run: cp release/wwwroot/index.html release/wwwroot/404.html

      - name: Fix GitHub Pages 404 for _framework (Underscore workaround)
        run: |
          if [ -d "release/wwwroot/_framework" ]; then
            echo "Framework folder exists. Nojekyll will handle the underscores."
          fi

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./release/wwwroot
          cname: tickets.naindev.com
